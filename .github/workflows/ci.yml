# What this gates, and what it cannot.
#
# core:check is the pure half of the project -- the rules engine, run log,
# achievements and tutorial script -- plus the JaCoCo coverage gate on those
# packages. It runs headless, so it belongs here.
#
# The Scene2D screens are deliberately NOT covered. They need a window, a GPU
# and screenshot pixels to verify (see .claude/skills/run-scoundrel), which no
# runner has. A green check here says the build is sound and the engine is
# correct; it says nothing about whether anything renders. Do not treat it as a
# substitute for the screenshot pass on UI work.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # only used to refresh the coverage badge on main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # One Gradle invocation on purpose: org.gradle.daemon=false in
      # gradle.properties means every call pays full JVM startup.
      #
      # Once the sprite branch lands, core:check will also drag in :packAtlas
      # through processResources, making this a clean-checkout proof that the
      # texture atlas packs -- it is generated and gitignored, so nothing else
      # would ever check it.
      - name: Check
        run: ./gradlew core:check lwjgl3:compileJava

      # Regenerate the README badge from the report this run just produced. Only
      # on main, and only committed when the number actually moved, so PR runs
      # stay read-only and green pushes don't each add a commit. [skip ci] stops
      # the badge commit from triggering another run of this workflow.
      - name: Refresh coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python3 .github/scripts/coverage_badge.py \
            core/build/reports/jacoco/test/jacocoTestReport.xml \
            .github/badges/coverage.svg
          if [ -n "$(git status --porcelain .github/badges/coverage.svg)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.svg
            git commit -m "chore: update coverage badge [skip ci]"
            # A cosmetic badge must never fail the build -- branch protection
            # can legitimately reject this push. Warn instead.
            git push || echo "::warning::coverage badge push rejected; badge left stale"
          else
            echo "coverage unchanged; nothing to commit"
          fi

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            core/build/reports/
            core/build/test-results/
          retention-days: 7
