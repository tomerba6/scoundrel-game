buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    // TexturePacker, for the sprite atlas built below. Build-time only — this
    // never reaches the shipped runtime classpath.
    classpath "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
  }
}

import com.badlogic.gdx.files.FileHandle
import com.badlogic.gdx.graphics.Texture.TextureFilter
import com.badlogic.gdx.graphics.g2d.TextureAtlas
import com.badlogic.gdx.tools.texturepacker.TexturePacker

// The finished pixel art (HANDOFF.md) is delivered as 174 loose 64x64 PNGs.
// They live outside assets/ on purpose: if they were on the asset path, a stray
// Gdx.files.internal("atlas/<sprite>.png") would silently succeed and hand back
// a Linear-filtered texture -- blurry pixel art, no error. From here that same
// mistake fails loudly. Pack them into one atlas at build time; these settings
// are the art's contract, not preferences:
//   Nearest       - hand-placed pixels on a locked 80-colour ramp; any smoothing
//                   invents colours that aren't in the palette.
//   padding 2 +   - keeps neighbouring sprites from bleeding into each other
//   duplicatePadding  when the page is sampled at a page edge.
//   no whitespace - a creature's five idle frames are aligned to the full 64x64
//   stripping       box. Trimming each frame to its own content would shift them
//                   independently and the cycle would jitter.
def spriteSrc = file("$rootDir/art-source/atlas")
def spriteOut = file("$rootDir/assets/sprites")

tasks.register('packAtlas') {
  description = 'Packs art-source/atlas/ into assets/sprites/sprites.atlas.'
  inputs.dir(spriteSrc)
  outputs.dir(spriteOut)

  doLast {
    def settings = new TexturePacker.Settings()
    settings.filterMin = TextureFilter.Nearest
    settings.filterMag = TextureFilter.Nearest
    settings.paddingX = 2
    settings.paddingY = 2
    settings.duplicatePadding = true
    settings.stripWhitespaceX = false
    settings.stripWhitespaceY = false
    TexturePacker.process(settings, spriteSrc.path, spriteOut.path, 'sprites')

    // Check the result with the same parser the game will use. The failure mode
    // this guards is silent: a wrong setting merges or drops regions and the
    // game just draws the wrong creature. Expected count comes from the source
    // set rather than a hardcoded number, so it still holds if the art grows.
    int expected = spriteSrc.listFiles().count { it.name.endsWith('.png') }
    def data = new TextureAtlas.TextureAtlasData(
        new FileHandle(new File(spriteOut, 'sprites.atlas')), new FileHandle(spriteOut), false)
    if (data.regions.size != expected) {
      throw new GradleException(
          "atlas has ${data.regions.size} regions, expected $expected (one per source PNG)")
    }
    // Index parsing is what makes findRegions(stem + "_idle") return the five
    // frames in order, so prove it on a known cycle rather than trusting it.
    def idle = data.regions.findAll { it.name == 'creature_02_cellar_rat_clubs_idle' }
    if (idle*.index.sort() != [1, 2, 3, 4, 5]) {
      throw new GradleException(
          "creature_02_cellar_rat_clubs_idle has indexes ${idle*.index.sort()}, expected [1..5]")
    }
    logger.quiet("packAtlas: ${data.regions.size} regions on ${data.pages.size} page(s)")
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 21

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'
  // The packed atlas is an asset like any other, so it has to exist before the
  // assets folder is copied into the jar (and before lwjgl3:run reads it off disk).
  processResources.dependsOn ':packAtlas'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Scoundrel'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'Scoundrel' + '-parent'
