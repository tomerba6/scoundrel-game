[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

apply plugin: 'jacoco'

test {
  useJUnitPlatform()
  finalizedBy jacocoTestReport // always refresh the coverage report after tests
  // CoverageGateTest reads this file to check that every pure package is in the
  // gate's includes list below. Gradle cannot see that dependency on its own, so
  // editing the gate would leave :core:test UP-TO-DATE and the check unrun —
  // silent in exactly the case it exists for. Declaring it makes the edit
  // re-run the test.
  inputs.file('build.gradle').withPathSensitivity(PathSensitivity.RELATIVE)
  // Same blind spot, same fix: RimMaskTest and HurtMaskTest compare what the
  // generators produce against the delivered reference frames under
  // art-reference/, which live outside this module and so are invisible to
  // Gradle. Without this, changing the reference art leaves :core:test
  // UP-TO-DATE and the comparison unrun. Declared conditionally because both
  // tests are @EnabledIf on the directory existing — a checkout without the
  // art still builds.
  def referenceArt = rootProject.file('art-reference/sprites')
  if (referenceArt.isDirectory()) {
    inputs.dir(referenceArt).withPathSensitivity(PathSensitivity.RELATIVE)
  }
}

jacocoTestReport {
  dependsOn test
  reports {
    html.required = true
    xml.required = true // for any CI/coverage service later
  }
}

jacocoTestCoverageVerification {
  dependsOn test
  violationRules {
    // Gate only the pure, unit-testable packages. The GL-bound screens layer and
    // ScoundrelGame are screenshot-verified, not unit tested, so they are not
    // gated here — including them would just enforce a meaningless low number.
    rule {
      element = 'PACKAGE'
      includes = [
        'com.tomer.scoundrel.rules',
        'com.tomer.scoundrel.model',
        'com.tomer.scoundrel.runs',
        'com.tomer.scoundrel.achievements',
        'com.tomer.scoundrel.tutorial',
      ]
      limit { counter = 'LINE';   value = 'COVEREDRATIO'; minimum = 0.90 }
      limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.75 }
    }
  }
}
check.dependsOn jacocoTestCoverageVerification

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation "org.junit.jupiter:junit-jupiter:5.14.4"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
